#CloudBuild file


steps:
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args: ['echo', 'Building...']
  id: BUILD
options:
 logsBucket: 'gs://your-custom-logs-bucket'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args: ['echo', 'Testing...']
  id: TEST
options:
 logsBucket: 'gs://your-custom-logs-bucket'

- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  args:
  - gcloud
  - functions
  - deploy
  - $_FUNCTION_NAME
  - --region=$_FUNCTION_REGION
  - --source=.
  - --trigger-http
  - --runtime=$_FUNCTION_RUNTIME
  - --project=$_FUNCTION_PROJECT
  - --entry-point=$_ENTRY_POINT
  id: DEPLOY
options:
 logsBucket: 'gs://your-custom-logs-bucket'

substitutions:
    _FUNCTION_PROJECT : staging
    _FUNCTION_NAME    : my-nodejs-app
    _FUNCTION_REGION  : europe-west1
    _FUNCTION_RUNTIME : nodejs22
    _ENTRY_POINT      : helloHttp
